<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7f4">
    <link rel="icon" href="data:,">
    <title>My Tools</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #17231f;
        background: #f5f7f4;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        --green: #167653;
        --muted: #718078;
      }

      * { box-sizing: border-box; }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        padding: 28px 16px;
      }

      main { width: min(100%, 900px); margin: 0 auto; }
      header { margin: 0 0 22px; text-align: center; }
      h1 { margin: 0; font-size: clamp(2rem, 5vw, 2.8rem); letter-spacing: -.055em; }
      header p { margin: 10px 0 0; color: var(--muted); }

      .tools {
        display: grid;
        gap: 24px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .tool-card {
        padding: 22px;
        border: 1px solid #e8ede8;
        border-radius: 18px;
        background: #fff;
        box-shadow: 0 24px 70px rgb(22 48 36 / 9%);
      }
      h2 { margin: 0; font-size: 1.25rem; }
      .tool-card p { margin: 10px 0 22px; line-height: 1.5; }
      .tool-card a {
        display: inline-flex;
        align-items: center;
        min-height: 46px;
        padding: 12px 16px;
        border-radius: 10px;
        background: var(--green);
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }
      .tool-card a:hover { background: #123d30; }
      :focus-visible { outline: 3px solid #f3bb62; outline-offset: 3px; }

      @media (min-width: 681px) {
        body { display: grid; place-items: center; padding: 32px 20px; }
        header { margin-bottom: 28px; }
        .tools {
          grid-template-columns: repeat(auto-fit, minmax(0, calc((100% - 30px) / 2)));
          justify-content: center;
          gap: 30px;
        }
        .tool-card { padding: 32px; border-radius: 24px; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>My Tools</h1>
        <p>Simple tools for everyday tasks.</p>
      </header>

      <ul class="tools" aria-label="Tools">
        <li class="tool-card">
          <h2>Tip Calculator</h2>
          <p>Work out the tip and split the bill in seconds.</p>
          <a href="tip-calculator/">Open Tip Calculator →</a>
        </li>
      </ul>
    </main>
  </body>
</html>
